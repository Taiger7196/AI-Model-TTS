# CHIMERA-3B — the impossible target. NOT for single T4 (needs FSDP/multi-GPU).
# Same code, scaled config. Prototype on tiny first, scale when architecture is proven.
name: chimera-3b
target: codec

vocab_size: 8192
max_text_len: 512

sample_rate: 22050
n_fft: 1024
hop_length: 256
n_mel: 80
max_mel_len: 1024
max_codec_len: 1536

d_model: 3072
n_layers: 28
n_heads: 24
n_kv_heads: 8
d_ff: 8192
dropout: 0.0
rope_theta: 10000.0
grad_checkpoint: true

spk_d_model: 512
spk_layers: 6
spk_heads: 8

n_codebooks: 8
codebook_size: 2048

lr: 0.0001
weight_decay: 0.01
warmup_steps: 2000
max_steps: 500000
batch_size: 4
grad_accum: 16
grad_clip: 1.0
amp: true
num_workers: 4
log_every: 25
ckpt_every: 2000
sample_every: 2000
out_dir: checkpoints/chimera-3b
seed: 1337
