# CHIMERA FLASH — the "holy shit it talks" demo for Colab T4 free.
# 20M model, 128 short utterances, overfit regime. ~6-10 min wall-clock,
# then LISTEN: checkpoints/chimera-flash/samples/
# Run: python scripts/train.py --config configs/flash.yaml
name: chimera-flash
target: mel

vocab_size: 256
max_text_len: 256

sample_rate: 22050
n_fft: 1024
hop_length: 256
n_mel: 80
max_mel_len: 768
max_codec_len: 1024

d_model: 512
n_layers: 6
n_heads: 8
n_kv_heads: 4
d_ff: 1408
dropout: 0.0
rope_theta: 10000.0
grad_checkpoint: false

spk_d_model: 128
spk_layers: 2
spk_heads: 4

n_codebooks: 4
codebook_size: 1024

# perf
compile: true
cache_data: true
pin_memory: true
fused_opt: true
max_sec: 5.0
sample_len: 200
max_items: 128

lr: 0.0004
weight_decay: 0.01
warmup_steps: 50
max_steps: 600
batch_size: 32
grad_accum: 1
grad_clip: 1.0
amp: true
num_workers: 2
log_every: 20
ckpt_every: 300
sample_every: 200
out_dir: checkpoints/chimera-flash
seed: 1337
